 
# 质量，单位：kg 需要重新测量，以实际重量为标准
quad_mass : 3.0
# hov_percent会影响最大推力，若推力不足，可适当的增加数值
hov_percent : 0.47

Limit:
    # 位置比例控制
    pxy_int_max: 5.0 
    pz_int_max: 10.0 

hover_gain:
    # 位置比例控制
    Kp_xy: 2.0 
    Kp_z: 2.0 
    # 速度比例控制
    Kv_xy: 2.0
    Kv_z: 2.0
    # 速度积分控制?
    Kvi_xy: 0.3
    Kvi_z: 0.3
    # 加速度前馈系数
    Ka_xy: 1.0
    Ka_z: 1.0
    tilt_angle_max : 10.0

track_gain:
    # 位置比例控制
    Kp_xy: 2.0
    Kp_z: 2.0
    # 速度比例控制
    Kv_xy: 2.0
    Kv_z: 2.0
    # 速度积分控制?
    Kvi_xy: 0.1
    Kvi_z: 0.1
    # 加速度前馈系数
    Ka_xy: 1.0
    Ka_z: 1.0
    tilt_angle_max : 10.0

# 漂移补偿参数
drift_correction:
    enable: true           # 总开关，默认关闭（向后兼容）
    ema_alpha: 0.5          # EMA 滤波系数，越小越平滑
    outlier_threshold: 1.0  # 异常值阈值 (m)，单帧跳变超过此值则丢弃
    max_age: 2.0            # 漂移量最大有效期 (s)，超过则重置为零
