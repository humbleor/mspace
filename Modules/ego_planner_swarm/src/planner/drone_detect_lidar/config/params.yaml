# drone_detect_lidar 参数配置

# ============================================================================
# 特征提取参数
# ============================================================================

# 体素降采样尺寸 (米)
# 越大则点云越稀疏，特征点越少
voxel_size: 0.2

# 最大特征点数量
# 增加会提高配准精度但增加带宽和计算量
max_features: 200

# 角点曲率阈值
# 大于此值的点被识别为角点
corner_threshold: 0.1

# 平面点法向方差阈值
# 小于此值的点被识别为平面点
planar_threshold: 0.05

# 法向量估计邻域大小 (点数)
search_radius: 5

# 特征点最小间距 (米)
# 用于非极大值抑制
min_distance: 0.3

# LiDAR 线数 (用于 ring 滤波)
scan_ring_num: 32

# 特征发布频率 (Hz)
publish_frequency: 5.0

# ============================================================================
# ICP 配准参数
# ============================================================================

# 最大迭代次数
icp_max_iterations: 30

# 变换收敛阈值 (米)
icp_trans_epsilon: 0.001

# 适配度分数阈值 (超过认为失败)
icp_fitness_thresh: 5.0

# 对应点最大距离 (米)
icp_corr_dist: 1.5

# 是否使用 point-to-plane ICP (推荐 true)
icp_use_point_to_plane: true

# 最小内点数量
icp_min_inliers: 5

# 重叠区域配准参数
# 重叠搜索半径 (米)，变换后的邻居特征点在此半径内认为重叠
icp_overlap_radius: 5.0

# 最小重叠点数，少于该值跳过ICP
icp_min_overlap_points: 15

# 是否使用分层配准 (粗配准 + 精配准)
icp_use_hierarchical: false

# 粗配准迭代次数
icp_coarse_iterations: 5

# ============================================================================
# 位姿融合参数
# ============================================================================

# 位姿误差计算频率 (Hz)
compute_frequency: 5.0

# 邻居状态超时时间 (秒)
neighbor_timeout: 5.0

# 运动补偿启用
enable_motion_compensation: true

# 速度阈值 (小于此值不进行运动补偿)
motion_comp_vel_threshold: 0.1

# ============================================================================
# 通信参数
# ============================================================================

# 广播 IP (多机仿真时修改)
broadcast_ip: "255.255.255.255"

# 广播端口
broadcast_port: 9001

# TCP 连接 IP (下一个无人机)
next_drone_ip: "127.0.0.1"

# ============================================================================
# 调试参数
# ============================================================================

# 是否发布调试点云
enable_debug_visualization: true

# 是否打印详细日志
enable_verbose_logging: false
