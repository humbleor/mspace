# drone_detect_lidar 参数配置
# 基于树干特征匹配的森林场景多机相对定位

# ============================================================================
# 树检测参数
# ============================================================================

# 高度裁剪范围 (m)，林下 ~1.2m 飞行，去除地面(0m)和树冠(>3m)
tree_height_min: 0.3
tree_height_max: 3.0

# 体素降采样分辨率 (m)
tree_voxel_size: 0.15

# 欧氏聚类参数
tree_cluster_tolerance: 0.3     # 聚类最大间距 (m)
tree_min_cluster_size: 20       # 最小聚类点数
tree_max_cluster_size: 5000     # 最大聚类点数

# PCA 线性度阈值 (越高越像树干)
tree_linearity_threshold: 0.6

# ============================================================================
# 三角形匹配参数 (HashReg 风格)
# ============================================================================

# 三角形边长范围 (m)，低于最小值或高于最大值不参与匹配
triangle_min_side: 0.3
triangle_max_side: 20.0

# 等腰三角形判定阈值 (m)，任意两边差小于该值则剔除
isosceles_threshold: 0.1

# 等边三角形判定阈值 (m)，最大边与最小边差小于该值则剔除
equilateral_threshold: 0.15

# 粗糙匹配比例，边长和 × ratio 作为哈希搜索的边长差阈值
rough_dis_ratio: 0.05

# 几何验证距离 (m)，变换后点到对应点的最大允许距离
geom_verify_dist: 0.3

# ============================================================================
# 树匹配参数
# ============================================================================

# 最少共有树数量，少于该值不执行配准
min_common_trees: 3

# 无人机距离过滤阈值 (m)，超过此距离不执行匹配
drone_dist_threshold: 10.0

# 质量检查上限（仿真中 odometry 完美，这些值应远小于阈值）
max_translation: 3.0            # 最大平移 (m)
max_yaw_deg: 20.0               # 最大 yaw (度)
max_match_residual: 0.5         # 匹配 RMS 残差 (m)

# ============================================================================
# 节点运行参数
# ============================================================================

# 树检测与配准频率 (Hz)
compute_frequency: 5.0

# ============================================================================
# 通信参数
# ============================================================================

# 广播 IP (多机仿真时修改)
broadcast_ip: "255.255.255.255"

# 广播端口
broadcast_port: 9001

# TCP 连接 IP (下一个无人机)
next_drone_ip: "127.0.0.1"
